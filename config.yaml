# Configuración del recomendador de Pueblos Mágicos (rutas relativas a la raíz).

paths:
  raw_csv: data/raw/Rest-Mex_2025_train.csv
  artifacts_dir: artifacts
  reports_dir: reports

data:
  val_fraction: 0.1        # 90/10 estratificado por pueblo
  seed: 42
  max_chars: 1500          # truncado explícito (~375 tokens; el contexto de nomic es 512)
  max_reviews_per_town: null   # tope opcional de reseñas por pueblo (null = todas)

encoder:
  backend: ollama          # ollama | sentence_transformers
  model: nomic-embed-text-v2-moe
  batch_size: 128
  # nomic usa prefijos de tarea. Reseñas, HyDE y Anti-HyDE se comparan
  # documento-contra-documento, así que todos usan doc_prefix.
  doc_prefix: "search_document: "
  query_prefix: "search_query: "     # solo para la consulta cruda (línea base sin HyDE)
  # Backend alternativo (pip install -r requirements-optional.txt):
  st_model: sentence-transformers/paraphrase-multilingual-mpnet-base-v2

ollama:
  host: http://localhost:11434
  embed_timeout: 300
  keep_alive: 30m

archetypes:
  k: 10
  n_init: 10
  seed: 42
  n_keywords: 8
  n_representative: 3
  label_with_llm: true

llm:
  # Cadena de respaldo; al final siempre queda la plantilla de antónimos (sin LLM).
  chain: [gemini, groq, ollama]       # web y etiquetas de arquetipos
  eval_chain: [groq, ollama]          # evaluación con HyDE (no gasta la cuota de Gemini)

  gemini_model: gemini-3.5-flash      # gemini-3.8-flash: solo 20 solicitudes/día en la capa gratuita
  gemini_thinking_level: low          # razonamiento mínimo = menor latencia (null lo omite)
  gemini_timeout: 20                  # s; si se excede se pasa al siguiente eslabón
  gemini_rpm: 10                      # solicitudes por minuto
  gemini_api_key_env: GEMINI_API      # nombre de la variable en .env (nunca la clave)

  groq_model: openai/gpt-oss-120b     # API compatible con OpenAI
  groq_base_url: https://api.groq.com/openai/v1
  groq_reasoning_effort: low
  groq_timeout: 30
  groq_rpm: 30
  groq_api_key_env: GROQ_API

  ollama_model: qwen2.5:3b            # respaldo local; p. ej. qwen2.5:7b si se descarga después
  timeout: 90                         # s para el modelo local

  temperature: 0.4
  num_predict: 800
  retries: 1                          # reintentos por proveedor tras una salida mal formada
  cooldown: 300                       # s que se omite un proveedor después de un error
  cache: true                         # repetir un prompt no gasta cuota
  cache_dir: artifacts/llm_cache

ranking:
  lambda: 0.015            # calibrado en validación: menor sesgo de popularidad sin perder MRR macro (ver README)
  top_k: 5
  bottom_k: 5
