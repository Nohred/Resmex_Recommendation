# Selección de encoder en muestra · intfloat/multilingual-e5-large (backend sentence_transformers).
#
# Ficha: https://huggingface.co/intfloat/multilingual-e5-large (consultada el 2026-11-15)
#   - "Each input text should start with "query: " or "passage: ", even for non-English texts."
#   - Recuperación asimétrica: `passage: ` para documentos y `query: ` para consultas.
#     Reseñas, HyDE y Anti-HyDE son documentos en este sistema → `passage: `.
#   - "Long texts will be truncated to at most 512 tokens" · 1,024 dimensiones.
#   - max_chars 1500 (~400 tokens): cabe en el contexto; no hay variante larga.
#   - fp16: media precisión en GPU, como los F16 de Ollama. Medido con 500 reseñas en la
#     RTX 2070: 25 → 99 textos/s con lote de 32; coseno medio contra FP32 = 0.9999995
#     (mínimo 0.99998). Pico de VRAM: 1.3 GB.
# Requiere `pip install -r requirements-optional.txt` (PyTorch + sentence-transformers).
extends: config.yaml
paths:
  artifacts_dir: artifacts/exp/2026-11-16_enc_e5_large
  reports_dir: reports/exp/2026-11-16_enc_e5_large
data:
  max_reviews_per_town: 1500
encoder:
  backend: sentence_transformers
  st_model: intfloat/multilingual-e5-large
  batch_size: 128
  max_seq_length: 512
  fp16: true
  doc_prefix: "passage: "
  query_prefix: "query: "
